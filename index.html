<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎬 hello</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #000; color: #fff;
    font-family: Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 80px 20px 20px;
  }
  .content-wrapper {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 90vw;
  }
  h1 {
    font-size: 13px; font-weight: normal; margin-bottom: 20px;
    text-align: center; opacity: 0.6;
  }
  .video-container {
    position: relative; width: 100%;
    background: #000; border-radius: 12px; overflow: hidden;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .canvas-wrap {
    position: relative; width: 100%; padding-bottom: 56.25%;
  }
  .video-canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    display: block; background: #000;
  }
  .controls-overlay {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 30px 12px 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
    opacity: 0; transition: opacity 0.25s;
    pointer-events: none; z-index: 6;
  }
  .controls-overlay.visible { opacity: 1; pointer-events: auto; }
  .controls-bar { display: flex; align-items: center; gap: 8px; }
  .ctrl-btn {
    background: transparent; border: none; color: #fff;
    cursor: pointer; padding: 4px 6px;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl-btn svg { width: 22px; height: 22px; fill: #fff; display: block; }
  .progress-wrap { flex: 1; padding: 10px 0; }
  .progress-range {
    width: 100%; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: rgba(255,255,255,0.3);
    border-radius: 2px; outline: none; cursor: pointer;
  }
  .progress-range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #00ff88; box-shadow: 0 0 6px rgba(0,255,136,0.7);
    cursor: pointer;
  }
  .progress-range::-moz-range-thumb {
    width: 14px; height: 14px; border: none; border-radius: 50%;
    background: #00ff88; box-shadow: 0 0 6px rgba(0,255,136,0.7);
    cursor: pointer;
  }
  .time-display {
    font-size: 12px; color: #fff;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .center-play {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(0,0,0,0.5);
    border: 2px solid rgba(255,255,255,0.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 5; cursor: pointer;
    transition: opacity 0.3s, transform 0.3s;
    -webkit-tap-highlight-color: transparent;
  }
  .center-play svg { width: 30px; height: 30px; margin-left: 4px; fill: #fff; }
  .center-play.hidden {
    opacity: 0; pointer-events: none;
    transform: translate(-50%, -50%) scale(0.8);
  }
  .loading-overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: flex; justify-content: center; align-items: center;
    flex-direction: column; pointer-events: none; z-index: 8;
  }
  .loader {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #00ff88; border-radius: 50%;
    animation: spin 1s linear infinite, pulse 1.5s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.6); }
    50% { box-shadow: 0 0 15px 5px rgba(0,255,136,0.3); }
  }
  .loading-text {
    margin-top: 10px; font-size: 14px;
    color: #00ff88; letter-spacing: 1px;
  }
  .buffer-tips {
    font-size: 11px; color: rgba(255,255,255,0.4);
    margin-top: 8px; text-align: center;
  }
  .video-list {
    display: flex; flex-wrap: wrap; justify-content: center;
    margin-top: 20px; gap: 10px;
  }
  .video-button {
    padding: 10px 16px; font-size: 15px;
    border: none; border-radius: 8px;
    background-color: #333; color: white;
    cursor: pointer; transition: background-color 0.3s;
  }
  .video-button:hover { background-color: #555; }
  .video-button.active { background-color: #00c300; }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
</head>
<body>
<div class="content-wrapper">
  <h1>🎬 为避免财产损失，请勿相信视频中的广告</h1>
  <div class="video-container" id="videoContainer">
    <div class="canvas-wrap">
      <canvas class="video-canvas" id="videoCanvas"></canvas>
    </div>

    <div class="center-play" id="centerPlay">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>

    <div class="controls-overlay" id="controlsOverlay">
      <div class="controls-bar">
        <button class="ctrl-btn" id="playPauseBtn" aria-label="播放/暂停">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <div class="progress-wrap">
          <input type="range" class="progress-range" id="progressRange" min="0" max="10000" value="0" step="1">
        </div>
        <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
        <button class="ctrl-btn" id="fullscreenBtn" aria-label="全屏">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
      </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="loader"></div>
      <div class="loading-text">正在加载视频...</div>
    </div>
  </div>
  <div class="buffer-tips">如遇卡顿，请尝试暂停缓冲几秒 · 点击播放按钮开始观看</div>
</div>

<div class="video-list" id="videoList">
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNjI5L2hBN2l0blVkL2luZGV4Lm0zdTg=">视频1</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNC5maGJiZmYuY29tLzIwMjQxMTE5L2dvbGp6a2lNL2luZGV4Lm0zdTg=">视频2</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNDE4L3pPUE9KeTlPL2luZGV4Lm0zdTg=">视频3</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNjI3LzRnUXdUa0ptL2luZGV4Lm0zdTg=">视频4</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTA3L2drOHVWRGNaL2luZGV4Lm0zdTg=">视频5</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNzA4L1lIcHdyb1hIL2luZGV4Lm0zdTg=">视频6</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNTI4L3h4eHVWUGt5L2luZGV4Lm0zdTg=">视频7</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNDI5L3BJZ3FnckZvL2luZGV4Lm0zdTg=">视频8</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTA2L0dUU2pXWTViL2luZGV4Lm0zdTg=">视频9</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTAyL2k3UFJkNHBPL2luZGV4Lm0zdTg=">视频10</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwODE5L3EzSVp1bDd4L2luZGV4Lm0zdTg=">视频11</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTEwL3FyRjBXM2hSL2luZGV4Lm0zdTg=">视频12</button>
</div>

<script>
(function () {
  'use strict';

  /* ========== DOM 引用 ========== */
  var canvas = document.getElementById('videoCanvas');
  var ctx = canvas.getContext('2d');
  var videoContainer = document.getElementById('videoContainer');
  var centerPlay = document.getElementById('centerPlay');
  var controlsOverlay = document.getElementById('controlsOverlay');
  var playPauseBtn = document.getElementById('playPauseBtn');
  var playIcon = document.getElementById('playIcon');
  var pauseIcon = document.getElementById('pauseIcon');
  var progressRange = document.getElementById('progressRange');
  var timeDisplay = document.getElementById('timeDisplay');
  var fullscreenBtn = document.getElementById('fullscreenBtn');
  var loadingOverlay = document.getElementById('loadingOverlay');
  var buttons = document.querySelectorAll('.video-button');

  /* ========== 核心：video 元素不放进 DOM ========== */
  var video = document.createElement('video');
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');
  video.preload = 'auto';
  // 关键：不 appendChild 到 document，浏览器 DOM 里看不到 video

  var hls = null;
  var currentUrl = '';
  var pendingResumeTime = 0;
  var controlsHideTimer = null;
  var seeking = false;
  var drawRafId = null;

  /* ========== 进度存取 ========== */
  function saveProgress(url, time) {
    if (!url || !isFinite(time)) return;
    try { localStorage.setItem('progress_' + url, time.toFixed(1)); } catch (e) {}
  }
  function loadProgress(url) {
    try {
      var t = parseFloat(localStorage.getItem('progress_' + url));
      return isNaN(t) ? 0 : t;
    } catch (e) { return 0; }
  }

  /* ========== 时间格式化 ========== */
  function formatTime(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  /* ========== Canvas 尺寸 ========== */
  function resizeCanvas() {
    var rect = videoContainer.getBoundingClientRect();
    var w = Math.max(1, Math.round(rect.width));
    var h = Math.max(1, Math.round(rect.height));
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
  }

  /* ========== 逐帧绘制 ========== */
  function drawFrame() {
    if (video.readyState < 2) return;
    var cw = canvas.width, ch = canvas.height;
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;
    var scale = Math.min(cw / vw, ch / vh);
    var dw = vw * scale, dh = vh * scale;
    var dx = (cw - dw) / 2, dy = (ch - dh) / 2;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cw, ch);
    try { ctx.drawImage(video, dx, dy, dw, dh); } catch (e) {}
  }

  function drawLoop() {
    drawFrame();
    drawRafId = requestAnimationFrame(drawLoop);
  }
  function startDrawLoop() {
    if (drawRafId == null) drawRafId = requestAnimationFrame(drawLoop);
  }

  /* ========== 控件显示/隐藏 ========== */
  function showControls() {
    controlsOverlay.classList.add('visible');
    if (controlsHideTimer) clearTimeout(controlsHideTimer);
    if (!video.paused) {
      controlsHideTimer = setTimeout(function () {
        controlsOverlay.classList.remove('visible');
      }, 3000);
    }
  }

  /* ========== UI 同步 ========== */
  function updatePlayUI() {
    if (video.paused) {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      centerPlay.classList.remove('hidden');
      showControls();
    } else {
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
      centerPlay.classList.add('hidden');
      showControls();
    }
  }

  function updateProgressUI() {
    var d = video.duration, c = video.currentTime;
    if (isFinite(d) && d > 0) {
      if (!seeking) progressRange.value = Math.round((c / d) * 10000);
      timeDisplay.textContent = formatTime(c) + ' / ' + formatTime(d);
    } else {
      progressRange.value = 0;
      timeDisplay.textContent = '0:00 / 0:00';
    }
  }

  /* ========== 工具 ========== */
  function decodeBase64(str) {
    try { return atob(str.replace(/[\r\n\s]/g, '')); }
    catch (e) { return ''; }
  }
  function setActiveButton(enc) {
    for (var i = 0; i < buttons.length; i++) {
      var b = buttons[i];
      if (b.dataset.enc.trim() === enc) b.classList.add('active');
      else b.classList.remove('active');
    }
  }
  function showLoading() { loadingOverlay.style.display = 'flex'; }
  function hideLoading() { loadingOverlay.style.display = 'none'; }

  function applyResumeTime() {
    if (pendingResumeTime > 0 && isFinite(video.duration) && pendingResumeTime < video.duration - 1) {
      try { video.currentTime = pendingResumeTime; } catch (e) {}
    }
    pendingResumeTime = 0;
  }

  function destroyHls() {
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
  }

  /* ========== 播放/暂停 ========== */
  function togglePlay() {
    if (video.paused) {
      var p = video.play();
      if (p && p.catch) p.catch(function () {});
    } else {
      video.pause();
    }
  }

  /* ========== 加载视频 ========== */
  function loadVideo(url, resumeTime, isM3U8) {
    currentUrl = url;
    pendingResumeTime = resumeTime || 0;

    destroyHls();
    try { video.pause(); } catch (e) {}
    video.removeAttribute('src');
    try { video.load(); } catch (e) {}

    showLoading();
    resizeCanvas();
    startDrawLoop();

    var canUseHlsJs = isM3U8 && typeof Hls !== 'undefined' && Hls.isSupported();

    if (canUseHlsJs) {
      hls = new Hls({ enableWorker: true, startFragPrefetch: true });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        hideLoading();
        applyResumeTime();
        updatePlayUI();
        updateProgressUI();
        drawFrame();
      });
      hls.on(Hls.Events.ERROR, function (evt, data) {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else { destroyHls(); hideLoading(); }
      });
    } else {
      // iOS Safari：不支持 MSE，走系统原生 HLS
      video.addEventListener('loadedmetadata', function onMeta() {
        video.removeEventListener('loadedmetadata', onMeta);
        hideLoading();
        applyResumeTime();
        updatePlayUI();
        updateProgressUI();
        drawFrame();
      });
      video.src = url;
    }
  }

  function loadVideoFromEncoded(enc) {
    var url = decodeBase64(enc.trim());
    if (!url) return;
    var isM3U8 = url.indexOf('.m3u8') !== -1;
    setActiveButton(enc);
    showLoading();
    var resume = loadProgress(url);
    loadVideo(url, resume, isM3U8);
  }

  /* ========== 全屏 ========== */
  function toggleFullscreen() {
    var doc = document;
    var isFull = doc.fullscreenElement || doc.webkitFullscreenElement;
    if (!isFull) {
      var el = videoContainer;
      if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } else {
      if (doc.exitFullscreen) doc.exitFullscreen().catch(function () {});
      else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
    }
  }

  /* ========== video 事件 ========== */
  video.addEventListener('play', function () { updatePlayUI(); });
  video.addEventListener('pause', function () { updatePlayUI(); });
  video.addEventListener('timeupdate', function () {
    updateProgressUI();
    if (currentUrl) saveProgress(currentUrl, video.currentTime);
  });
  video.addEventListener('ended', function () { updatePlayUI(); });
  video.addEventListener('seeked', function () { drawFrame(); });
  video.addEventListener('loadeddata', function () { drawFrame(); });

  /* ========== 控件事件 ========== */
  centerPlay.addEventListener('click', function (e) {
    e.stopPropagation();
    togglePlay();
  });

  playPauseBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    togglePlay();
  });

  // 进度条拖动
  progressRange.addEventListener('input', function () {
    seeking = true;
    var d = video.duration;
    if (isFinite(d) && d > 0) {
      var t = (parseInt(progressRange.value, 10) / 10000) * d;
      timeDisplay.textContent = formatTime(t) + ' / ' + formatTime(d);
    }
  });
  progressRange.addEventListener('change', function () {
    var d = video.duration;
    if (isFinite(d) && d > 0) {
      var t = (parseInt(progressRange.value, 10) / 10000) * d;
      try { video.currentTime = t; } catch (e) {}
    }
    seeking = false;
    updateProgressUI();
  });

  fullscreenBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    toggleFullscreen();
  });

  // 点击画面：控件不可见 → 显示；可见 → 播放/暂停
  videoContainer.addEventListener('click', function () {
    if (!controlsOverlay.classList.contains('visible')) {
      showControls();
    } else {
      togglePlay();
    }
  });

  videoContainer.addEventListener('mousemove', showControls);

  /* ========== 列表按钮 ========== */
  for (var i = 0; i < buttons.length; i++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        loadVideoFromEncoded(btn.dataset.enc.trim());
      });
    })(buttons[i]);
  }

  /* ========== 窗口/旋转 ========== */
  window.addEventListener('resize', function () {
    resizeCanvas();
    drawFrame();
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { resizeCanvas(); drawFrame(); }, 300);
  });

  /* ========== 首屏加载第一个（不自动播放） ========== */
  if (buttons.length) {
    loadVideoFromEncoded(buttons[0].dataset.enc.trim());
  }
})();
</script>
</body>
</html>
