<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    min-height: 100vh;
    padding: 80px 20px 0;
  }
  .content-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 90vw;
  }
  h1 {
    font-size: 13px;
    font-weight: normal;
    margin-bottom: 20px;
    text-align: center;
    opacity: 0.6;
  }
  .video-container {
    position: relative;
    width: 100%;
  }
  video {
    width: 100%;
    height: auto;
    border-radius: 12px;
    background: #000;
  }
  .buffer-tips {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    margin-top: 8px;
    text-align: center;
  }
  .loading-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    pointer-events: none;
    border-radius: 12px;
  }
  .loader {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255, 255, 255, 0.2);
    border-top-color: #00ff88;
    border-radius: 50%;
    animation: spin 1s linear infinite, pulse 1.5s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.6); }
    50% { box-shadow: 0 0 15px 5px rgba(0,255,136,0.3); }
  }
  .loading-text {
    margin-top: 10px;
    font-size: 14px;
    color: #00ff88;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
  }
  .dots span {
    opacity: 0;
    color: #00ff88;
    text-shadow: 0 0 5px #00ff88, 0 0 10px #00ff88;
    animation: blink 1.5s infinite;
  }
  .dots span:nth-child(1) { animation-delay: 0s; }
  .dots span:nth-child(2) { animation-delay: 0.3s; }
  .dots span:nth-child(3) { animation-delay: 0.6s; }
  @keyframes blink {
    0%, 20% { opacity: 0; }
    30%, 80% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* -------- 布局严格按照要求：3个一行，列距10px，行距24px，底距12px -------- */
  .video-list {
    display: grid;
    grid-template-columns: repeat(3, auto);
    justify-content: center;
    justify-items: center;
    width: 100%;
    max-width: 90vw;
    margin-top: 20px;
    column-gap: 10px;
    row-gap: 24px;
    margin-bottom: 12px;
  }
  /* --------------------------------------------------------------- */

  .video-button {
    padding: 10px 16px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    background-color: #333;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  .video-button:hover { background-color: #555; }
  .video-button.active { background-color: #00c300; }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
</head>
<body>
<div class="content-wrapper">
  <h1>🎬 为避免财产损失，请勿相信视频中的广告</h1>
  <div class="video-container">
    <video id="video" playsinline webkit-playsinline preload="auto" controls></video>
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loader"></div>
      <div class="loading-text">
        正在加载视频<span class="dots"><span>.</span><span>.</span><span>.</span></span>
      </div>
    </div>
  </div>
  <div class="buffer-tips">如遇卡顿，请尝试暂停缓冲几秒</div>
</div>

<div class="video-list" id="videoList">
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNjI5L2hBN2l0blVkL2luZGV4Lm0zdTg=">视频1</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNC5maGJiZmYuY29tLzIwMjQxMTE5L2dvbGp6a2lNL2luZGV4Lm0zdTg=">视频2</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNDE4L3pPUG9KeTlPL2luZGV4Lm0zdTg=">视频3</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNjI3LzRnUXdUa0ptL2luZGV4Lm0zdTg=">视频4</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTA3L2drOHVWRGNaL2luZGV4Lm0zdTg=">视频5</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNzA4L1lIcHdyb1hIL2luZGV4Lm0zdTg=">视频6</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNTI4L3h4eHVWUGt5L2luZGV4Lm0zdTg=">视频7</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNDI5L3BJZ3FnckZvL2luZGV4Lm0zdTg=">视频8</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTA2L0dUU2pXWTViL2luZGV4Lm0zdTg=">视频9</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTAyL2k3UFJkNHBPL2luZGV4Lm0zdTg=">视频10</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwODE5L3EzSVp1bDd4L2luZGV4Lm0zdTg=">视频11</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTEwL3FyRjBXM2hSL2luZGV4Lm0zdTg=">视频12</button>
  <button class="video-button" data-enc="aHR0cHM6Ly8yNjA3LmZodjIwMjYuY29tLzIwMjYwODIxL21zckFhYWR5L2luZGV4Lm0zdTg=">视频13</button>
  <button class="video-button" data-enc="aHR0cHM6Ly8yNjA3LmZodjIwMjYuY29tLzIwMjYwODE5L21pV21LbU8zL2luZGV4Lm0zdTg=">视频14</button>
  <button class="video-button" data-enc="aHR0cHM6Ly8yNjA3LmZodjIwMjYuY29tLzIwMjYwODI1L1ZmT1h6eFRtL2luZGV4Lm0zdTg=">视频15</button>
</div>

<script>
const video = document.getElementById('video');
const buttons = document.querySelectorAll('.video-button');
const loadingOverlay = document.getElementById('loadingOverlay');
let hls = null;
let lastSaveTime = 0;

let currentPlayingUrl = ""; 
let isVideoSwitching = false; // 【核心修复3】切换状态锁：防止 load() 瞬间产生0秒进度覆盖本地数据

// --- 记忆播放：保存进度 ---
function saveProgress(url, time) {
  if (!url || isNaN(time) || time <= 0) return;
  try {
    localStorage.setItem("progress_" + url, time.toFixed(1));
  } catch (e) {}
}

// --- 记忆播放：读取进度 ---
function loadProgress(url) {
  try {
    const t = parseFloat(localStorage.getItem("progress_" + url));
    return isNaN(t) ? 0 : t;
  } catch (e) {
    return 0;
  }
}

// --- 核心保存函数 ---
function saveCurrentProgress() {
  // 防御机制：如果没有 URL，或正在切换视频，或时间为 0，则一律拒绝保存以防误伤
  if (!currentPlayingUrl || isVideoSwitching || isNaN(video.currentTime) || video.currentTime < 1) return;
  
  // 【核心修复4】如果视频即将播完(剩不到2秒)，不要保存，避免下次打开直接结束
  if (video.duration && !isNaN(video.duration) && video.currentTime >= video.duration - 2) return;
  
  saveProgress(currentPlayingUrl, video.currentTime);
}

function setActiveButton(enc) {
  buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.enc.trim() === enc));
}
function showLoading() { loadingOverlay.style.display = 'flex'; }
function hideLoading() { loadingOverlay.style.display = 'none'; }

function decodeBase64(str) {
  try { return atob(str.replace(/[\r\n\s]/g, "")); }
  catch (e) { return ""; }
}

// --- 核心加载视频逻辑 ---
function loadVideo(url, resumeTime, isM3U8, userInitiated = false) {
  video.pause();
  video.removeAttribute('src');
  video.load();

  if (hls) {
    hls.destroy();
    hls = null;
  }

  currentPlayingUrl = url;
  isVideoSwitching = false; // 解除切换锁定，允许正常保存进度

  const canNativePlay = video.canPlayType('application/vnd.apple.mpegurl') || video.canPlayType('application/x-mpegURL');

  // 安卓 / 桌面端 Chrome：使用 Hls.js 播放
  if (isM3U8 && typeof Hls !== 'undefined' && Hls.isSupported() && !canNativePlay) {
    hls = new Hls({
      enableWorker: true,
      startFragPrefetch: true,
      // 【核心修复1】利用 Hls.js 原生 startPosition 直接跳转进度，彻底抛弃 MANIFEST_PARSED 中强制定位
      startPosition: resumeTime > 0 ? resumeTime : -1 
    });
    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      if (currentPlayingUrl !== url) return;
      if (userInitiated) {
        video.play().catch(() => {});
      }
      hideLoading();
    });

    hls.on(Hls.Events.ERROR, function(event, data) {
      if (data.fatal) {
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            hls.startLoad();
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            hls.recoverMediaError();
            break;
          default:
            hls.destroy();
            hideLoading();
            break;
        }
      }
    });
  } else {
    // iOS Safari / Mac Safari：走原生 m3u8 播放流程
    video.src = url;
    
    let hasResumed = false;
    const tryResume = () => {
      // 保证同一个视频只恢复一次
      if (currentPlayingUrl !== url || hasResumed) return;
      if (resumeTime > 0) {
        try {
          video.currentTime = resumeTime;
          hasResumed = true;
        } catch (e) {
          // iOS 下抛出异常（说明媒体分片还没准备好），忽略并交给下一个事件重试
        }
      } else {
        hasResumed = true; 
      }
    };

    // 【核心修复2】iOS 下暴力多重事件兜底（loadedmetadata 通常不够），谁先就绪谁恢复
    video.addEventListener('loadedmetadata', tryResume);
    video.addEventListener('canplay', tryResume);
    video.addEventListener('play', tryResume);

    video.addEventListener('loadedmetadata', () => {
      if (currentPlayingUrl !== url) return;
      if (userInitiated) {
        video.play().catch(() => {});
      }
      hideLoading();
    }, { once: true });
  }

  video.controls = true;
}

function loadVideoFromEncoded(encStr, userInitiated = false) {
  const url = decodeBase64(encStr.trim());
  if (!url) return;
  if (url === currentPlayingUrl) return; // 重复点击同一视频拦截

  // 核心：在正式切断旧 URL 之前，立刻保存旧视频进度
  saveCurrentProgress();
  
  isVideoSwitching = true; // 上锁：防止下面 load() 过程中触发 pause/timeupdate 把进度存为0
  currentPlayingUrl = "";  // 清空 URL，避免串联误伤

  const isM3U8 = url.includes(".m3u8");
  setActiveButton(encStr);
  showLoading();
  
  const resumeTime = loadProgress(url);
  loadVideo(url, resumeTime, isM3U8, userInitiated);
}

// --- 全方位进度保存监听 ---
video.addEventListener('timeupdate', () => {
  if (!currentPlayingUrl || video.paused || isVideoSwitching) return;
  const now = Date.now();
  if (now - lastSaveTime > 1000) { // 每秒写一次
    lastSaveTime = now;
    saveCurrentProgress();
  }
});

video.addEventListener('pause', saveCurrentProgress);

// 【核心修复4】视频正常播完时主动清零进度（下次重新开始）
video.addEventListener('ended', () => {
  if (currentPlayingUrl) {
    saveProgress(currentPlayingUrl, 0);
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveCurrentProgress();
});
window.addEventListener('pagehide', saveCurrentProgress);
window.addEventListener('beforeunload', saveCurrentProgress);

// --- 初始化与事件绑定 ---
loadVideoFromEncoded(buttons[0].dataset.enc.trim(), false);

buttons.forEach(btn => {
  btn.addEventListener('click', () => loadVideoFromEncoded(btn.dataset.enc.trim(), true));
});

video.addEventListener('playing', hideLoading);
video.addEventListener('canplay', hideLoading);
</script>
</body>
</html>
