<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 hello</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    min-height: 100vh;
    padding: 80px 20px 20px;
  }
  .content-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 90vw;
  }
  h1 {
    font-size: 13px;
    font-weight: normal;
    margin-bottom: 20px;
    text-align: center;
    opacity: 0.6;
  }
  .video-container {
    position: relative;
    width: 100%;
  }
  video {
    width: 100%;
    height: auto;
    border-radius: 12px;
    background: #000;
  }
  .buffer-tips {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    margin-top: 8px;
    text-align: center;
  }
  .loading-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    pointer-events: none;
    border-radius: 12px;
  }
  .loader {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255, 255, 255, 0.2);
    border-top-color: #00ff88;
    border-radius: 50%;
    animation: spin 1s linear infinite, pulse 1.5s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.6); }
    50% { box-shadow: 0 0 15px 5px rgba(0,255,136,0.3); }
  }
  .loading-text {
    margin-top: 10px;
    font-size: 14px;
    color: #00ff88;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
  }
  .dots span {
    opacity: 0;
    color: #00ff88;
    text-shadow: 0 0 5px #00ff88, 0 0 10px #00ff88;
    animation: blink 1.5s infinite;
  }
  .dots span:nth-child(1) { animation-delay: 0s; }
  .dots span:nth-child(2) { animation-delay: 0.3s; }
  .dots span:nth-child(3) { animation-delay: 0.6s; }
  @keyframes blink {
    0%, 20% { opacity: 0; }
    30%, 80% { opacity: 1; }
    100% { opacity: 0; }
  }
  .video-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
    gap: 10px;
  }
  .video-button {
    padding: 10px 16px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    background-color: #333;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  .video-button:hover { background-color: #555; }
  .video-button.active { background-color: #00c300; }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
</head>
<body>
<div class="content-wrapper">
  <h1>🎬 为避免财产损失，请勿相信视频中的广告</h1>
  <div class="video-container">
    <!-- 不加 autoplay，手动播放 -->
    <video id="video" playsinline webkit-playsinline preload="metadata" controls></video>
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loader"></div>
      <div class="loading-text">
        正在加载视频<span class="dots"><span>.</span><span>.</span><span>.</span></span>
      </div>
    </div>
  </div>
  <div class="buffer-tips">如遇卡顿，请尝试暂停缓冲几秒 · 点击播放按钮开始观看</div>
</div>

<div class="video-list" id="videoList">
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNjI5L2hBN2l0blVkL2luZGV4Lm0zdTg=">视频1</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNC5maGJiZmYuY29tLzIwMjQxMTE5L2dvbGp6a2lNL2luZGV4Lm0zdTg=">视频2</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNDE4L3pPUE9KeTlPL2luZGV4Lm0zdTg=">视频3</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNjI3LzRnUXdUa0ptL2luZGV4Lm0zdTg=">视频4</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTA3L2drOHVWRGNaL2luZGV4Lm0zdTg=">视频5</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNzA4L1lIcHdyb1hIL2luZGV4Lm0zdTg=">视频6</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNTI4L3h4eHVWUGt5L2luZGV4Lm0zdTg=">视频7</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNDI5L3BJZ3FnckZvL2luZGV4Lm0zdTg=">视频8</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTA2L0dUU2pXWTViL2luZGV4Lm0zdTg=">视频9</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTAyL2k3UFJkNHBPL2luZGV4Lm0zdTg=">视频10</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwODE5L3EzSVp1bDd4L2luZGV4Lm0zdTg=">视频11</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTEwL3FyRjBXM2hSL2luZGV4Lm0zdTg=">视频12</button>
</div>

<script>
(function () {
  'use strict';

  var video = document.getElementById('video');
  var buttons = document.querySelectorAll('.video-button');
  var loadingOverlay = document.getElementById('loadingOverlay');

  var hls = null;                 // 当前 hls.js 实例
  var currentUrl = '';            // 当前视频地址（用于存进度）
  var pendingResumeTime = 0;      // 待恢复的播放进度
  var activeNativeHandler = null; // 原生播放的 loadedmetadata 回调

  /* ---------- 进度存取 ---------- */
  function saveProgress(url, time) {
    if (!url || !isFinite(time)) return;
    try { localStorage.setItem('progress_' + url, time.toFixed(1)); } catch (e) {}
  }
  function loadProgress(url) {
    try {
      var t = parseFloat(localStorage.getItem('progress_' + url));
      return isNaN(t) ? 0 : t;
    } catch (e) { return 0; }
  }

  /* ---------- UI ---------- */
  function setActiveButton(enc) {
    for (var i = 0; i < buttons.length; i++) {
      var b = buttons[i];
      if (b.dataset.enc.trim() === enc) b.classList.add('active');
      else b.classList.remove('active');
    }
  }
  function showLoading() { loadingOverlay.style.display = 'flex'; }
  function hideLoading() { loadingOverlay.style.display = 'none'; }

  /* ---------- Base64 ---------- */
  function decodeBase64(str) {
    try { return atob(str.replace(/[\r\n\s]/g, '')); }
    catch (e) { return ''; }
  }

  /* ---------- 恢复进度（只在已就绪后调用） ---------- */
  function applyResumeTime(t) {
    if (!t || !isFinite(t) || t <= 0) return;
    var d = video.duration;
    if (isFinite(d) && d > 0 && t >= d - 1) return; // 已接近结尾则从头播
    try { video.currentTime = t; } catch (e) {}
  }

  /* ---------- 清理 ---------- */
  function destroyHls() {
    if (hls) {
      try { hls.destroy(); } catch (e) {}
      hls = null;
    }
  }
  function resetVideoElement() {
    try { video.pause(); } catch (e) {}
    if (activeNativeHandler) {
      video.removeEventListener('loadedmetadata', activeNativeHandler);
      activeNativeHandler = null;
    }
    video.removeAttribute('src');
    try { video.load(); } catch (e) {}
  }

  /* ---------- 加载视频 ---------- */
  function loadVideo(url, resumeTime, isM3U8) {
    currentUrl = url;
    pendingResumeTime = resumeTime || 0;

    // 先摘掉旧的进度保存
    if (video._saveHandler) {
      video.removeEventListener('timeupdate', video._saveHandler);
    }

    destroyHls();
    resetVideoElement();
    showLoading();

    // 关键判断：iOS Safari 不支持 MSE，Hls.isSupported() 为 false，
    // 直接交给系统原生 HLS 播放（否则就是黑屏）
    var canUseHlsJs = isM3U8 &&
                      typeof Hls !== 'undefined' &&
                      Hls.isSupported();

    if (canUseHlsJs) {
      hls = new Hls({
        enableWorker: true,
        startFragPrefetch: true
      });
      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        hideLoading();
        applyResumeTime(pendingResumeTime);
        // ❌ 不调用 video.play()，交给用户手动播放
      });

      hls.on(Hls.Events.ERROR, function (event, data) {
        if (!data.fatal) return;
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            hls.startLoad();
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            hls.recoverMediaError();
            break;
          default:
            destroyHls();
            hideLoading();
            break;
        }
      });

    } else {
      // 原生播放：iOS Safari、旧安卓、或直接是 mp4 的情况
      activeNativeHandler = function () {
        video.removeEventListener('loadedmetadata', activeNativeHandler);
        activeNativeHandler = null;
        hideLoading();
        applyResumeTime(pendingResumeTime);
        // ❌ 同样不自动 play
      };
      video.addEventListener('loadedmetadata', activeNativeHandler);
      video.src = url;
    }

    video.controls = true;

    // 进度保存
    video._saveHandler = function () {
      saveProgress(currentUrl, video.currentTime);
    };
    video.addEventListener('timeupdate', video._saveHandler);
  }

  /* ---------- 由按钮触发 ---------- */
  function loadVideoFromEncoded(encStr) {
    var url = decodeBase64(encStr.trim());
    if (!url) return;
    var isM3U8 = url.indexOf('.m3u8') !== -1;
    setActiveButton(encStr);
    showLoading();
    var resumeTime = loadProgress(url);
    loadVideo(url, resumeTime, isM3U8);
  }

  /* ---------- 事件绑定 ---------- */
  video.addEventListener('playing', hideLoading);
  video.addEventListener('canplay', hideLoading);
  video.addEventListener('error', hideLoading); // 出错时别一直转圈

  for (var i = 0; i < buttons.length; i++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        loadVideoFromEncoded(btn.dataset.enc.trim());
      });
    })(buttons[i]);
  }

  /* ---------- 首屏：只加载第一个视频，不播放 ---------- */
  if (buttons.length) {
    loadVideoFromEncoded(buttons[0].dataset.enc.trim());
  }
})();
</script>
</body>
</html>
