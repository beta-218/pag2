<script>
const video = document.getElementById('video');
const buttons = document.querySelectorAll('.video-button');
const loadingOverlay = document.getElementById('loadingOverlay');

let hls = null;
let currentUrl = '';
let currentResumeTime = 0;
let saveTimer = null;
let isRestoring = false;
let restoreAttempts = 0;

/* =========================
   安全存储
========================= */

function saveProgress(url, time) {
  if (!url || !Number.isFinite(time) || time < 0) return;

  try {
    localStorage.setItem(
      "progress_" + url,
      time.toFixed(1)
    );
  } catch (e) {
    console.warn("无法保存播放进度:", e);
  }
}

function loadProgress(url) {
  try {
    const value = parseFloat(
      localStorage.getItem("progress_" + url)
    );

    return Number.isFinite(value) && value >= 0
      ? value
      : 0;
  } catch (e) {
    console.warn("无法读取播放进度:", e);
    return 0;
  }
}

function clearProgress(url) {
  try {
    localStorage.removeItem("progress_" + url);
  } catch (e) {
    console.warn("无法清除播放进度:", e);
  }
}

/* =========================
   页面 UI
========================= */

function setActiveButton(enc) {
  buttons.forEach(btn => {
    btn.classList.toggle(
      'active',
      btn.dataset.enc.trim() === enc
    );
  });
}

function showLoading() {
  loadingOverlay.style.display = 'flex';
}

function hideLoading() {
  loadingOverlay.style.display = 'none';
}

function decodeBase64(str) {
  try {
    return atob(str.replace(/[\r\n\s]/g, ""));
  } catch (e) {
    return "";
  }
}

/* =========================
   进度保存
========================= */

function saveCurrentProgress() {
  if (!currentUrl) return;

  const time = video.currentTime;

  if (
    Number.isFinite(time) &&
    time > 0 &&
    !video.ended
  ) {
    saveProgress(currentUrl, time);
  }
}

/* 每 2 秒保存一次，避免移动端退出时丢失太多进度 */
function startProgressSaving() {
  stopProgressSaving();

  saveTimer = setInterval(() => {
    saveCurrentProgress();
  }, 2000);
}

function stopProgressSaving() {
  if (saveTimer) {
    clearInterval(saveTimer);
    saveTimer = null;
  }
}

/* =========================
   恢复播放位置
========================= */

function getSafeResumeTime(time) {
  if (!Number.isFinite(time) || time <= 0) {
    return 0;
  }

  /*
   * 如果视频已经有 duration，
   * 避免恢复到视频末尾或超出范围。
   */
  if (
    Number.isFinite(video.duration) &&
    video.duration > 0
  ) {
    if (time >= video.duration - 2) {
      return 0;
    }

    return Math.min(
      time,
      Math.max(0, video.duration - 1)
    );
  }

  return time;
}

function restorePlaybackPosition() {
  if (!isRestoring) return;

  restoreAttempts++;

  const resumeTime = getSafeResumeTime(
    currentResumeTime
  );

  if (resumeTime <= 0) {
    isRestoring = false;
    return;
  }

  /*
   * 对 HLS / Safari，优先检查 seekable 范围。
   * 如果当前时间轴还没准备好，稍后重试。
   */
  if (video.seekable && video.seekable.length > 0) {
    const start = video.seekable.start(0);
    const end = video.seekable.end(
      video.seekable.length - 1
    );

    if (resumeTime >= start && resumeTime <= end) {
      try {
        video.currentTime = resumeTime;
        isRestoring = false;
        console.log("已恢复播放位置:", resumeTime);
        return;
      } catch (e) {
        console.warn("恢复播放位置失败:", e);
      }
    }
  }

  /*
   * 普通 MP4 或 duration 已知时，
   * 可以直接尝试恢复。
   */
  if (
    Number.isFinite(video.duration) &&
    video.duration > 0
  ) {
    try {
      video.currentTime = resumeTime;
      isRestoring = false;
      console.log("已恢复播放位置:", resumeTime);
      return;
    } catch (e) {
      console.warn("恢复播放位置失败:", e);
    }
  }

  /*
   * 移动端媒体加载较慢，最多重试 20 次。
   */
  if (restoreAttempts < 20) {
    setTimeout(restorePlaybackPosition, 300);
  } else {
    isRestoring = false;
    console.warn("恢复播放位置超时");
  }
}

/* =========================
   加载视频
========================= */

function loadVideo(url, resumeTime, isM3U8, userInitiated = false) {
  currentUrl = url;
  currentResumeTime = resumeTime;
  restoreAttempts = 0;
  isRestoring = resumeTime > 0;

  video.pause();

  if (hls) {
    hls.destroy();
    hls = null;
  }

  video.removeAttribute('src');
  video.load();

  const canNativePlay =
    video.canPlayType('application/vnd.apple.mpegurl') ||
    video.canPlayType('application/x-mpegURL');

  /*
   * 安卓 / 桌面 Chrome：Hls.js
   */
  if (
    isM3U8 &&
    typeof Hls !== 'undefined' &&
    Hls.isSupported() &&
    !canNativePlay
  ) {
    hls = new Hls({
      enableWorker: true,
      startFragPrefetch: true
    });

    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      /*
       * 不在这里直接恢复 currentTime。
       * 等 loadedmetadata / canplay 后恢复。
       */
      if (userInitiated) {
        video.play().catch(() => {});
      }
    });

    hls.on(Hls.Events.ERROR, function(event, data) {
      if (data.fatal) {
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            hls.startLoad();
            break;

          case Hls.ErrorTypes.MEDIA_ERROR:
            hls.recoverMediaError();
            break;

          default:
            hls.destroy();
            hls = null;
            hideLoading();
            break;
        }
      }
    });

  } else {
    /*
     * iOS Safari / Mac Safari 原生 HLS
     */
    video.src = url;

    if (userInitiated) {
      video.play().catch(() => {});
    }
  }

  video.controls = true;
}

/* =========================
   从按钮加载视频
========================= */

function loadVideoFromEncoded(encStr, userInitiated = false) {
  const url = decodeBase64(encStr.trim());

  if (!url) return;

  setActiveButton(encStr);
  showLoading();

  const resumeTime = loadProgress(url);
  const isM3U8 = url.includes(".m3u8");

  loadVideo(
    url,
    resumeTime,
    isM3U8,
    userInitiated
  );
}

/* =========================
   媒体事件
========================= */

/*
 * 媒体元数据加载完成后，开始尝试恢复。
 */
video.addEventListener('loadedmetadata', () => {
  restorePlaybackPosition();
});

/*
 * canplay 表示已经具备一定播放能力。
 * 对移动端恢复位置很重要。
 */
video.addEventListener('canplay', () => {
  restorePlaybackPosition();
  hideLoading();
});

/*
 * playing 后再次检查，防止某些 HLS 流
 * 在 canplay 时 seekable 范围还没准备好。
 */
video.addEventListener('playing', () => {
  restorePlaybackPosition();
  hideLoading();
});

/*
 * 用户拖动进度条后，立即保存。
 */
video.addEventListener('seeked', () => {
  saveCurrentProgress();
});

/*
 * 播放过程中持续保存。
 */
video.addEventListener('timeupdate', () => {
  saveCurrentProgress();
});

/*
 * 播放结束后清除进度。
 * 下次重新从头播放。
 */
video.addEventListener('ended', () => {
  clearProgress(currentUrl);
});

/* =========================
   移动端离开 / 后台保存
========================= */

/*
 * 页面进入后台时保存。
 * 移动端切换 App、锁屏等场景很重要。
 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    saveCurrentProgress();
  }
});

/*
 * 页面被卸载、返回上一页、关闭标签页时保存。
 */
window.addEventListener('pagehide', () => {
  saveCurrentProgress();
});

/* =========================
   初始化
========================= */

startProgressSaving();

/*
 * 页面初始化加载第一个视频。
 * 不自动播放，避免 iOS 自动播放拦截。
 */
loadVideoFromEncoded(
  buttons[0].dataset.enc.trim(),
  false
);

/*
 * 点击按钮切换视频。
 */
buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    loadVideoFromEncoded(
      btn.dataset.enc.trim(),
      true
    );
  });
});
</script>
