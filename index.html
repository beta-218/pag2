<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    min-height: 100vh;
    padding: 80px 20px 0;
  }
  .content-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 90vw;
  }
  h1 {
    font-size: 13px;
    font-weight: normal;
    margin-bottom: 20px;
    text-align: center;
    opacity: 0.6;
  }
  .video-container {
    position: relative;
    width: 100%;
  }
  video {
    width: 100%;
    height: auto;
    border-radius: 12px;
    background: #000;
  }
  .buffer-tips {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    margin-top: 8px;
    text-align: center;
  }
  .loading-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    pointer-events: none;
    border-radius: 12px;
  }
  .loader {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255, 255, 255, 0.2);
    border-top-color: #00ff88;
    border-radius: 50%;
    animation: spin 1s linear infinite, pulse 1.5s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.6); }
    50% { box-shadow: 0 0 15px 5px rgba(0,255,136,0.3); }
  }
  .loading-text {
    margin-top: 10px;
    font-size: 14px;
    color: #00ff88;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
  }
  .dots span {
    opacity: 0;
    color: #00ff88;
    text-shadow: 0 0 5px #00ff88, 0 0 10px #00ff88;
    animation: blink 1.5s infinite;
  }
  .dots span:nth-child(1) { animation-delay: 0s; }
  .dots span:nth-child(2) { animation-delay: 0.3s; }
  .dots span:nth-child(3) { animation-delay: 0.6s; }
  @keyframes blink {
    0%, 20% { opacity: 0; }
    30%, 80% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* -------- 布局严格按照要求：3个一行，列距10px，行距24px，底距12px -------- */
  .video-list {
    display: grid;
    grid-template-columns: repeat(3, auto);
    justify-content: center;
    justify-items: center;
    width: 100%;
    max-width: 90vw;
    margin-top: 20px;
    column-gap: 10px;
    row-gap: 24px;
    margin-bottom: 12px;
  }
  /* --------------------------------------------------------------- */

  .video-button {
    padding: 10px 16px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    background-color: #333;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  .video-button:hover { background-color: #555; }
  .video-button.active { background-color: #00c300; }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
</head>
<body>
<div class="content-wrapper">
  <h1>🎬 为避免财产损失，请勿相信视频中的广告</h1>

      </div>

<div class="video-list" id="videoList">
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNjI5L2hBN2l0blVkL2luZGV4Lm0zdTg=">视频1</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNC5maGJiZmYuY29tLzIwMjQxMTE5L2dvbGp6a2lNL2luZGV4Lm0zdTg=">视频2</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNDE4L3pPUG9KeTlPL2luZGV4Lm0zdTg=">视频3</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNjI3LzRnUXdUa0ptL2luZGV4Lm0zdTg=">视频4</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTA3L2drOHVWRGNaL2luZGV4Lm0zdTg=">视频5</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNzA4L1lIcHdyb1hIL2luZGV4Lm0zdTg=">视频6</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNTI4L3h4eHVWUGt5L2luZGV4Lm0zdTg=">视频7</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNDI5L3BJZ3FnckZvL2luZGV4Lm0zdTg=">视频8</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTA2L0dUU2pXWTViL2luZGV4Lm0zdTg=">视频9</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTAyL2k3UFJkNHBPL2luZGV4Lm0zdTg=">视频10</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwODE5L3EzSVp1bDd4L2luZGV4Lm0zdTg=">视频11</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTEwL3FyRjBXM2hSL2luZGV4Lm0zdTg=">视频12</button>
  <button class="video-button" data-enc="aHR0cHM6Ly8yNjA3LmZodjIwMjYuY29tLzIwMjYwODIxL21zckFhYWR5L2luZGV4Lm0zdTg=">视频13</button>
  <button class="video-button" data-enc="aHR0cHM6Ly8yNjA3LmZodjIwMjYuY29tLzIwMjYwODE5L21pV21LbU8zL2luZGV4Lm0zdTg=">视频14</button>
  <button class="video-button" data-enc="aHR0cHM6Ly8yNjA3LmZodjIwMjYuY29tLzIwMjYwODI1L1ZmT1h6eFRtL2luZGV4Lm0zdTg=">视频15</button>
</div>

<script>
const video = document.getElementById('video');
const buttons = document.querySelectorAll('.video-button');
const loadingOverlay = document.getElementById('loadingOverlay');
let hls = null;
let lastSaveTime = 0;
let currentPlayingUrl = ""; 
let isSwitching = false;

function getStorageKey(url) {
  try {
    const cleanPath = new URL(url).pathname.replace(/[^a-zA-Z0-9]/g, "_");
    return "a7r7_progress_" + cleanPath;
  } catch (e) {
    return "a7r7_progress_fallback";
  }
}

// 【关键升级】同时写入 LocalStorage 与 Cookie，防止小米/华为等国产浏览器在切后台时直接销毁 Storage
function saveProgress(url, time) {
  if (!url || isNaN(time) || time < 2) return;
  try {
    const key = getStorageKey(url);
    const val = time.toFixed(1);
    localStorage.setItem(key, val);
    // 写入 Cookie 30天有效，作为国产定制浏览器的兜底备份
    document.cookie = `${key}=${val}; max-age=2592000; path=/`;
  } catch (e) {}
}

function loadProgress(url) {
  if (!url) return 0;
  try {
    const key = getStorageKey(url);
    // 优先从 LocalStorage 读取
    let t = parseFloat(localStorage.getItem(key));
    if (!isNaN(t) && t > 0) return t;

    // 如果 LocalStorage 读不到，尝试从 Cookie 中提取
    const match = document.cookie.match(new RegExp('(^| )' + key + '=([^;]+)'));
    if (match) {
      t = parseFloat(match[2]);
      if (!isNaN(t) && t > 0) return t;
    }
  } catch (e) {}
  return 0;
}

function saveCurrentProgress() {
  if (!currentPlayingUrl || isSwitching || isNaN(video.currentTime)) return;
  if (video.duration && !isNaN(video.duration) && video.currentTime >= video.duration - 2) {
    saveProgress(currentPlayingUrl, 0);
    return;
  }
  saveProgress(currentPlayingUrl, video.currentTime);
}

function setActiveButton(enc) {
  buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.enc.trim() === enc));
}
function showLoading() { loadingOverlay.style.display = 'flex'; }
function hideLoading() { loadingOverlay.style.display = 'none'; }

function decodeBase64(str) {
  try { return atob(str.replace(/[\r\n\s]/g, "")); }
  catch (e) { return ""; }
}

function loadVideo(url, resumeTime, isM3U8, userInitiated = false) {
  isSwitching = true;
  video.pause();
  video.removeAttribute('src');
  video.load();

  if (hls) {
    hls.destroy();
    hls = null;
  }

  currentPlayingUrl = url;
  const canNativePlay = video.canPlayType('application/vnd.apple.mpegurl') || video.canPlayType('application/x-mpegURL');

  if (isM3U8 && typeof Hls !== 'undefined' && Hls.isSupported() && !canNativePlay) {
    hls = new Hls({
      enableWorker: true,
      startFragPrefetch: true,
      startPosition: resumeTime > 0 ? resumeTime : -1
    });
    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      isSwitching = false;
      if (resumeTime > 0) {
        // 确保 HLS.js 挂载后二次硬编码强行纠正（针对部分小米/华为 WebView 第一次生效不彻底的问题）
        try { video.currentTime = resumeTime; } catch(e){}
      }
      if (userInitiated) {
        video.play().catch(() => {});
      }
      hideLoading();
    });

    hls.on(Hls.Events.ERROR, function(event, data) {
      if (data.fatal) {
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR: hls.startLoad(); break;
          case Hls.ErrorTypes.MEDIA_ERROR: hls.recoverMediaError(); break;
          default: hls.destroy(); hideLoading(); break;
        }
      }
    });
  } else {
    // 【关键升级】针对苹果 Safari / 其它原生 WebView 采用多阶段强力延时跳转
    video.src = url;
    
    let appliedCount = 0;
    const forceSeek = () => {
      if (currentPlayingUrl !== url || appliedCount > 5) return;
      if (resumeTime > 0) {
        try {
          if (video.duration && !isNaN(video.duration)) {
            video.currentTime = resumeTime;
            appliedCount++;
          }
        } catch (err) {}
      }
    };

    video.addEventListener('loadedmetadata', () => {
      forceSeek();
      isSwitching = false;
      if (userInitiated) video.play().catch(() => {});
      hideLoading();
    }, { once: true });

    // 针对旧版 Safari 及部分定制内核增加多重事件与延时定时器硬跳
    video.addEventListener('canplay', forceSeek);
    video.addEventListener('playing', forceSeek);
    setTimeout(forceSeek, 500);
    setTimeout(forceSeek, 1200);
  }

  video.controls = true;
}

function loadVideoFromEncoded(encStr, userInitiated = false) {
  const url = decodeBase64(encStr.trim());
  if (!url) return;
  
  saveCurrentProgress();
  
  setActiveButton(encStr);
  showLoading();

  const resumeTime = loadProgress(url);
  const isM3U8 = url.includes(".m3u8");
  loadVideo(url, resumeTime, isM3U8, userInitiated);
}

// 频繁滚动实时保存
video.addEventListener('timeupdate', () => {
  if (!currentPlayingUrl || video.paused || isSwitching) return;
  const now = Date.now();
  if (now - lastSaveTime > 1000) {
    lastSaveTime = now;
    saveCurrentProgress();
  }
});

// 各种退出、暂停事件全量同步触发保存
video.addEventListener('pause', saveCurrentProgress);
video.addEventListener('ended', () => {
  if (currentPlayingUrl) saveProgress(currentPlayingUrl, 0);
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveCurrentProgress();
});
window.addEventListener('pagehide', saveCurrentProgress);
window.addEventListener('beforeunload', saveCurrentProgress);

// 初始化第一个视频
loadVideoFromEncoded(buttons[0].dataset.enc.trim(), false);

buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    loadVideoFromEncoded(btn.dataset.enc.trim(), true);
  });
});

video.addEventListener('playing', hideLoading);
video.addEventListener('canplay', hideLoading);
</script>
</body>
