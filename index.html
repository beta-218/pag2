<script>
const video = document.getElementById('video');
const buttons = document.querySelectorAll('.video-button');
const loadingOverlay = document.getElementById('loadingOverlay');

let hls = null;
let currentUrl = '';
let currentResumeTime = 0;
let saveTimer = null;
let isRestoring = false;
let restoreAttempts = 0;

/* =========================
   localStorage Progress Management
========================= */

function saveProgress(url, time) {
  if (!url || !Number.isFinite(time) || time < 0) return;
  try {
    localStorage.setItem("progress_" + url, time.toFixed(1));
  } catch (e) {
    console.warn("无法保存播放进度:", e);
  }
}

function loadProgress(url) {
  try {
    const value = parseFloat(localStorage.getItem("progress_" + url));
    return Number.isFinite(value) && value >= 0 ? value : 0;
  } catch (e) {
    console.warn("无法读取播放进度:", e);
    return 0;
  }
}

function clearProgress(url) {
  try {
    localStorage.removeItem("progress_" + url);
  } catch (e) {
    console.warn("无法清除播放进度:", e);
  }
}

/* =========================
   UI and Helper Functions
========================= */

function setActiveButton(enc) {
  buttons.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.enc.trim() === enc);
  });
}

function showLoading() {
  loadingOverlay.style.display = 'flex';
  loadingOverlay.style.opacity = '1';
}

function hideLoading() {
  loadingOverlay.style.opacity = '0';
  setTimeout(() => {
    if (loadingOverlay.style.opacity === '0') {
      loadingOverlay.style.display = 'none';
    }
  }, 300);
}

function decodeBase64(str) {
  try {
    // Decode Base64 string
    let decoded = atob(str.replace(/[\r\n\s]/g, ""));
    
    // Core Fix: Standardize fake/spoofed extensions (.m3th, .m3to, etc.) back to .m3u8
    return decoded.replace(/\.m3[a-z0-9]+$/i, '.m3u8');
  } catch (e) {
    console.error("Base64解码错误:", e);
    return "";
  }
}

/* =========================
   Progress Saver Logic
========================= */

function saveCurrentProgress() {
  if (!currentUrl) return;
  const time = video.currentTime;
  if (Number.isFinite(time) && time > 0 && !video.ended) {
    saveProgress(currentUrl, time);
  }
}

function startProgressSaving() {
  stopProgressSaving();
  saveTimer = setInterval(() => {
    saveCurrentProgress();
  }, 2000);
}

function stopProgressSaving() {
  if (saveTimer) {
    clearInterval(saveTimer);
    saveTimer = null;
  }
}

function getSafeResumeTime(time) {
  if (!Number.isFinite(time) || time <= 0) return 0;
  if (Number.isFinite(video.duration) && video.duration > 0) {
    if (time >= video.duration - 2) return 0;
    return Math.min(time, Math.max(0, video.duration - 1));
  }
  return time;
}

function restorePlaybackPosition() {
  if (!isRestoring) return;
  restoreAttempts++;

  const resumeTime = getSafeResumeTime(currentResumeTime);
  if (resumeTime <= 0) {
    isRestoring = false;
    return;
  }

  // Check seekable range for HLS streams
  if (video.seekable && video.seekable.length > 0) {
    const start = video.seekable.start(0);
    const end = video.seekable.end(video.seekable.length - 1);
    if (resumeTime >= start && resumeTime <= end) {
      try {
        video.currentTime = resumeTime;
        isRestoring = false;
        console.log("已恢复播放位置:", resumeTime);
        return;
      } catch (e) {
        console.warn("恢复播放位置失败:", e);
      }
    }
  }

  // Standard video duration seek
  if (Number.isFinite(video.duration) && video.duration > 0) {
    try {
      video.currentTime = resumeTime;
      isRestoring = false;
      console.log("已恢复播放位置:", resumeTime);
      return;
    } catch (e) {
      console.warn("恢复播放位置失败:", e);
    }
  }

  // Retry up to 20 times for slow mobile connections
  if (restoreAttempts < 20) {
    setTimeout(restorePlaybackPosition, 300);
  } else {
    isRestoring = false;
    console.warn("恢复播放位置超时");
  }
}

function loadVideo(url, resumeTime, isM3U8, userInitiated = false) {
  saveCurrentProgress();

  currentUrl = url;
  currentResumeTime = resumeTime;
  restoreAttempts = 0;
  isRestoring = resumeTime > 0;

  video.pause();

  if (hls) {
    hls.destroy();
    hls = null;
  }

  video.removeAttribute('src');
  video.load();

  const canNativePlay = video.canPlayType('application/vnd.apple.mpegurl') || 
                        video.canPlayType('application/x-mpegURL');

  // Hls.js for Chrome/Android
  if (isM3U8 && typeof Hls !== 'undefined' && Hls.isSupported() && !canNativePlay) {
    hls = new Hls({
      enableWorker: true,
      startFragPrefetch: true
    });

    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      if (userInitiated) {
        video.play().catch(() => {});
      }
    });

    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            hls.startLoad();
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            hls.recoverMediaError();
            break;
          default:
            hls.destroy();
            hls = null;
            hideLoading();
            break;
        }
      }
    });
  } else {
    // Native HLS for Safari/iOS
    video.src = url;
    if (userInitiated) {
      video.play().catch(() => {});
    }
  }

  video.controls = true;
}

function loadVideoFromEncoded(encStr, userInitiated = false) {
  const url = decodeBase64(encStr.trim());

  if (!url) {
    console.error("无法解析有效的视频链接");
    return;
  }

  setActiveButton(encStr);
  showLoading();

  const resumeTime = loadProgress(url);
  const isM3U8 = url.includes(".m3u8");

  loadVideo(url, resumeTime, isM3U8, userInitiated);
}

video.addEventListener('loadedmetadata', () => {
  restorePlaybackPosition();
});

video.addEventListener('canplay', () => {
  restorePlaybackPosition();
  hideLoading();
});

video.addEventListener('playing', () => {
  restorePlaybackPosition();
  hideLoading();
});

video.addEventListener('seeked', () => {
  saveCurrentProgress();
});

video.addEventListener('timeupdate', () => {
  saveCurrentProgress();
});

video.addEventListener('ended', () => {
  clearProgress(currentUrl);
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    saveCurrentProgress();
  }
});

window.addEventListener('pagehide', () => {
  saveCurrentProgress();
});

startProgressSaving();

// Load initial video without auto-playing to comply with mobile policies
loadVideoFromEncoded(buttons[0].dataset.enc.trim(), false);

// Bind button click events
buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    loadVideoFromEncoded(btn.dataset.enc.trim(), true);
  });
});
</script>
