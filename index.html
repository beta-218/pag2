<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Video Player</title>
<style>
  * { 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent;
  }
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    min-height: 100vh;
    padding: 30px 15px 20px;
  }
  .content-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 90vw;
  }
  /* 调整后的提示文字样式 */
  h1 {
    font-size: 12px;
    font-weight: normal;
    margin: 0 0 12px 0;
    text-align: center;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 0.5px;
  }
  .video-container {
    position: relative;
    width: 100%;
  }
  video {
    width: 100%;
    height: auto;
    border-radius: 12px;
    background: #000;
    display: block;
  }
  .loading-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    pointer-events: none;
    border-radius: 12px;
  }
  .loader {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255, 255, 255, 0.2);
    border-top-color: #00ff88;
    border-radius: 50%;
    animation: spin 1s linear infinite, pulse 1.5s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.6); }
    50% { box-shadow: 0 0 15px 5px rgba(0,255,136,0.3); }
  }
  .loading-text {
    margin-top: 10px;
    font-size: 13px;
    color: #00ff88;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
  }
  .dots span {
    opacity: 0;
    color: #00ff88;
    text-shadow: 0 0 5px #00ff88, 0 0 10px #00ff88;
    animation: blink 1.5s infinite;
  }
  .dots span:nth-child(1) { animation-delay: 0s; }
  .dots span:nth-child(2) { animation-delay: 0.3s; }
  .dots span:nth-child(3) { animation-delay: 0.6s; }
  @keyframes blink {
    0%, 20% { opacity: 0; }
    30%, 80% { opacity: 1; }
    100% { opacity: 0; }
  }
  .video-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
    gap: 10px;
  }
  .video-button {
    padding: 8px 14px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    background-color: #222;
    color: #ccc;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .video-button:hover { background-color: #444; color: #fff; }
  .video-button.active { background-color: #00c300; color: #fff; font-weight: bold; }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>
</head>
<body>
<div class="content-wrapper">
  <h1>🎬 为避免财产损失，请勿相信视频中的广告</h1>
  <div class="video-container">
    <video id="video" playsinline webkit-playsinline preload="auto" controls></video>
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loader"></div>
      <div class="loading-text">
        正在加载视频<span class="dots"><span>.</span><span>.</span><span>.</span></span>
      </div>
    </div>
  </div>
</div>

<div class="video-list" id="videoList">
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNjI5L2hBN2l0blVkL2luZGV4Lm0zdTg=">视频1</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNC5maGJiZmYuY29tLzIwMjQxMTE5L2dvbGp6a2lNL2luZGV4Lm0zdTg=">视频2</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNDE4L3pPUG9KeTlPL2luZGV4Lm0zdTg=">视频3</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNjI3LzRnUXdUa0ptL2luZGV4Lm0zdTg=">视频4</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTA3L2drOHVWRGNaL2luZGV4Lm0zdTg=">视频5</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNzA4L1lIcHdyb1hIL2luZGV4Lm0zdTg=">视频6</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNTI4L3h4eHVWUGt5L2luZGV4Lm0zdTg=">视频7</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNDI5L3BJZ3FnckZvL2luZGV4Lm0zdTg=">视频8</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTA2L0dUU2pXWTViL2luZGV4Lm0zdTg=">视频9</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTAyL2k3UFJkNHBPL2luZGV4Lm0zdTg=">视频10</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwODE5L3EzSVp1bDd4L2luZGV4Lm0zdTg=">视频11</button>
  <!-- 修复了视频12 Base64字符串开头的 h 丢失问题 -->
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTEwL3FyRjBXM2hSL2luZGV4Lm0zdTg=">视频12</button>
</div>

<script>
const video = document.getElementById('video');
const buttons = document.querySelectorAll('.video-button');
const loadingOverlay = document.getElementById('loadingOverlay');
let hls = null;
let lastSaveTime = 0;

function saveProgress(url, time){ 
  // 每 2 秒才向 localStorage 保存一次，防止密集 I/O 导致手机卡顿
  const now = Date.now();
  if (now - lastSaveTime > 2000) {
    localStorage.setItem("progress_" + url, time.toFixed(1)); 
    lastSaveTime = now;
  }
}

function loadProgress(url){ 
  const t = parseFloat(localStorage.getItem("progress_" + url)); 
  return isNaN(t) ? 0 : t; 
}

function setActiveButton(enc){ 
  buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.enc.trim() === enc)); 
}

function showLoading(){ loadingOverlay.style.display = 'flex'; }
function hideLoading(){ loadingOverlay.style.display = 'none'; }

function decodeBase64(str){
  try { return atob(str.replace(/[\r\n\s]/g, "")); }
  catch(e){ return ""; }
}

function loadVideo(url, resumeTime, isM3U8){
  video.pause();
  video.removeAttribute('src');
  video.load();

  if(hls){ 
    hls.destroy(); 
    hls = null; 
  }

  // 区分 PC/Android (Hls.js) 与 原生 iOS Safari 支持
  if(isM3U8 && Hls.isSupported()){
    hls = new Hls({
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      fragLoadingTimeOut: 20000,
      manifestLoadingTimeOut: 20000,
      enableWorker: true,
      startFragPrefetch: true
    });
    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      if(resumeTime > 0) video.currentTime = resumeTime;
      video.play().catch(()=>{});
      hideLoading();
    });

    hls.on(Hls.Events.ERROR, function(event, data){
      if(data.fatal){
        switch(data.type){
          case Hls.ErrorTypes.NETWORK_ERROR:
            hls.startLoad();
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            hls.recoverMediaError();
            break;
          default:
            hls.destroy();
            hideLoading();
            break;
        }
      }
    });

  } else {
    // 兼容 iOS 原生播放 m3u8
    video.src = url;
    video.addEventListener('loadedmetadata', function onLoaded(){
      video.removeEventListener('loadedmetadata', onLoaded);
      if(resumeTime > 0) video.currentTime = resumeTime;
      video.play().catch(()=>{});
      hideLoading();
    });
  }

  // 绑定进度记忆监听
  if (video._saveHandler) {
    video.removeEventListener('timeupdate', video._saveHandler);
  }
  video._saveHandler = () => saveProgress(url, video.currentTime);
  video.addEventListener('timeupdate', video._saveHandler);

  // 视频播放完毕后清空该视频的记忆，方便下次重头播放
  video.onended = () => {
    localStorage.removeItem("progress_" + url);
  };
}

function loadVideoFromEncoded(encStr){
  const url = decodeBase64(encStr.trim());
  if(!url) return;
  const isM3U8 = url.includes(".m3u8");
  setActiveButton(encStr);
  showLoading();
  const resumeTime = loadProgress(url);
  loadVideo(url, resumeTime, isM3U8);
}

// 默认加载第一集
loadVideoFromEncoded(buttons[0].dataset.enc.trim());

// 绑定按钮点击事件
buttons.forEach(btn => {
  btn.addEventListener('click', () => loadVideoFromEncoded(btn.dataset.enc.trim()));
});

// 监听播放状态隐去 loading 动画
video.addEventListener('playing', hideLoading);
video.addEventListener('canplay', hideLoading);
</script>
</body>
</html>
