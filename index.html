<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 hello</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    min-height: 100vh;
    padding: 80px 20px 20px;
  }
  .content-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 90vw;
  }
  h1 {
    font-size: 13px;
    font-weight: normal;
    margin-bottom: 20px;
    text-align: center;
    opacity: 0.6;
  }
  .video-container {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%; /* 16:9 占位 */
    background: #000;
    border-radius: 12px;
    overflow: hidden;
  }
  .video-container iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #000;
  }
  .buffer-tips {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    margin-top: 8px;
    text-align: center;
  }
  .video-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
    gap: 10px;
  }
  .video-button {
    padding: 10px 16px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    background-color: #333;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  .video-button:hover { background-color: #555; }
  .video-button.active { background-color: #00c300; }
</style>
</head>
<body>
<div class="content-wrapper">
  <h1>🎬 为避免财产损失，请勿相信视频中的广告</h1>
  <div class="video-container" id="playerContainer"></div>
  <div class="buffer-tips">如遇卡顿，请尝试暂停缓冲几秒 · 点击播放按钮开始观看</div>
</div>

<div class="video-list" id="videoList">
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNjI5L2hBN2l0blVkL2luZGV4Lm0zdTg=">视频1</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNC5maGJiZmYuY29tLzIwMjQxMTE5L2dvbGp6a2lNL2luZGV4Lm0zdTg=">视频2</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNDE4L3pPUE9KeTlPL2luZGV4Lm0zdTg=">视频3</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNjI3LzRnUXdUa0ptL2luZGV4Lm0zdTg=">视频4</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTA3L2drOHVWRGNaL2luZGV4Lm0zdTg=">视频5</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNzA4L1lIcHdyb1hIL2luZGV4Lm0zdTg=">视频6</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNTI4L3h4eHVWUGt5L2luZGV4Lm0zdTg=">视频7</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwNDI5L3BJZ3FnckZvL2luZGV4Lm0zdTg=">视频8</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTA2L0dUU2pXWTViL2luZGV4Lm0zdTg=">视频9</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTAyL2k3UFJkNHBPL2luZGV4Lm0zdTg=">视频10</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwODE5L3EzSVp1bDd4L2luZGV4Lm0zdTg=">视频11</button>
  <button class="video-button" data-enc="aHR0cHM6Ly92MjAyNS5maGJiZmYuY29tLzIwMjUwOTEwL3FyRjBXM2hSL2luZGV4Lm0zdTg=">视频12</button>
</div>

<script>
(function () {
  'use strict';

  var buttons = document.querySelectorAll('.video-button');
  var playerContainer = document.getElementById('playerContainer');

  /* ---------- 进度存取（主页面负责，iframe 只上报） ---------- */
  function saveProgress(url, time) {
    if (!url || !isFinite(time)) return;
    try { localStorage.setItem('progress_' + url, time.toFixed(1)); } catch (e) {}
  }
  function loadProgress(url) {
    try {
      var t = parseFloat(localStorage.getItem('progress_' + url));
      return isNaN(t) ? 0 : t;
    } catch (e) { return 0; }
  }

  /* ---------- Base64 ---------- */
  function decodeBase64(str) {
    try { return atob(str.replace(/[\r\n\s]/g, '')); }
    catch (e) { return ''; }
  }

  /* ---------- 按钮状态 ---------- */
  function setActiveButton(enc) {
    for (var i = 0; i < buttons.length; i++) {
      var b = buttons[i];
      if (b.dataset.enc.trim() === enc) b.classList.add('active');
      else b.classList.remove('active');
    }
  }

  /* ---------- 构造 iframe 内的播放器 HTML ---------- */
  function buildPlayerHtml(url, resumeTime) {
    var isM3U8 = url.indexOf('.m3u8') !== -1;
    var urlJson = JSON.stringify(url);
    var resumeNum = (isFinite(resumeTime) && resumeTime > 0) ? resumeTime : 0;

    var html = ''
      + '<!DOCTYPE html>'
      + '<html lang="zh-CN"><head><meta charset="UTF-8">'
      + '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
      + '<style>'
      + 'html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;}'
      + 'video{width:100%;height:100%;display:block;background:#000;outline:none;}'
      + '</style>'
      + '<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></scr' + 'ipt>'
      + '</head><body>'
      // 这里同样保持你原始的标签写法：playsinline + webkit-playsinline + preload=auto + controls
      + '<video id="v" playsinline webkit-playsinline preload="auto" controls></video>'
      + '<scr' + 'ipt>'
      + '(function(){'
      + '  var v = document.getElementById("v");'
      + '  var url = ' + urlJson + ';'
      + '  var resume = ' + resumeNum + ';'
      + '  var isM3U8 = ' + (isM3U8 ? 'true' : 'false') + ';'

      + '  function applyResume(){'
      + '    if(resume > 0 && isFinite(v.duration) && resume < v.duration - 1){'
      + '      try { v.currentTime = resume; } catch(e){}'
      + '    }'
      + '  }'

      + '  if(isM3U8 && typeof Hls !== "undefined" && Hls.isSupported()){'
      + '    var hls = new Hls({enableWorker:true, startFragPrefetch:true});'
      + '    hls.loadSource(url);'
      + '    hls.attachMedia(v);'
      + '    hls.on(Hls.Events.MANIFEST_PARSED, applyResume);'
      + '    hls.on(Hls.Events.ERROR, function(evt, data){'
      + '      if(!data.fatal) return;'
      + '      if(data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();'
      + '      else if(data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();'
      + '      else hls.destroy();'
      + '    });'
      + '  } else {'
      + '    v.src = url;'
      + '    v.addEventListener("loadedmetadata", applyResume);'
      + '  }'

      // 不自动播放，交给用户手动点击

      // 定时把进度上报给父页面
      + '  setInterval(function(){'
      + '    if(v.currentTime > 0){'
      + '      try { parent.postMessage({type:"progress", url:url, time:v.currentTime}, "*"); } catch(e){}'
      + '    }'
      + '  }, 2000);'
      + '})();'
      + '</scr' + 'ipt>'
      + '</body></html>';

    return html;
  }

  /* ---------- 加载视频：重建 iframe ---------- */
  function loadVideoFromEncoded(encStr) {
    var url = decodeBase64(encStr.trim());
    if (!url) return;

    setActiveButton(encStr);

    var resume = loadProgress(url);
    var html = buildPlayerHtml(url, resume);

    // 清掉旧 iframe，创建新的
    playerContainer.innerHTML = '';
    var iframe = document.createElement('iframe');
    iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture');
    iframe.setAttribute('allowfullscreen', 'true');
    iframe.setAttribute('webkitallowfullscreen', 'true');
    iframe.setAttribute('mozallowfullscreen', 'true');
    // sandbox 不给 allow-same-origin，让 iframe 拥有独立不透明源，
    // 小米主页面注入的脚本无法访问它的 DOM
    iframe.setAttribute('sandbox', 'allow-scripts');
    iframe.setAttribute('srcdoc', html);
    playerContainer.appendChild(iframe);
  }

  /* ---------- 接收 iframe 上报的进度 ---------- */
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'progress' && e.data.url) {
      saveProgress(e.data.url, e.data.time);
    }
  });

  /* ---------- 绑定按钮 ---------- */
  for (var i = 0; i < buttons.length; i++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        loadVideoFromEncoded(btn.dataset.enc.trim());
      });
    })(buttons[i]);
  }

  /* ---------- 首屏加载第一个视频（不自动播放） ---------- */
  if (buttons.length) {
    loadVideoFromEncoded(buttons[0].dataset.enc.trim());
  }
})();
</script>
</body>
</html>
